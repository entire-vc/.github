<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" role="img" aria-labelledby="title desc">
<title id="title">One workspace. Connected capabilities</title><desc id="desc">People use the Mesh web interface. Agents connect directly through MCP or REST; Runner starts or resumes Claude Code and Codex task sessions on your machine. Keep delivers secrets to the target host, outside model context. TokenLedger shows usage. Your extension can be released, reviewed and shared through Spark, then installed in Mesh.</desc>
